[project]
name = "project-feedback-analyzer"
version = "0.1.0"
description = "AI-powered customer feedback analysis with FastAPI, Streamlit, Gemini, and SQLite"
readme = "README.md"
authors = [
    { name = "Krishna Rokkam", email = "chaitanya4595@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "google-genai>=2.8.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "streamlit>=1.58.0",
]


[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
